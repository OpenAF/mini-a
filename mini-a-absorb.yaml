help:
  text: |
    Reviewable local wiki absorption. Plan makes proposals; apply/resume never call a model.
    ojob mini-a-absorb.yaml absorbop=plan absorbspec=./sources.json wikiroot=./wiki wikiaccess=rw
    ojob mini-a-absorb.yaml absorbop=show absorbplan=<id> wikiroot=./wiki
    ojob mini-a-absorb.yaml absorbop=apply absorbplan=<id> wikiroot=./wiki wikiaccess=rw
    See docs/ABSORB.md for selection, provenance, budgets and recovery.
  expects:
  - name: absorbop
    desc: plan, show, apply, status, resume, delete or cancel
  - name: absorbspec
    desc: JSON, YAML (.yaml/.yml) or SLON (.slon) file, or inline JSON/SLON map or sources array (plan)
  - name: absorbplan
    desc: Saved plan ID (show/apply/resume/delete/cancel)
  - name: absorboutput
    desc: Explicit external artifact directory, required for read-only planning
  - name: absorbmaxpages
    desc: Selected page budget (default 100)
  - name: absorbmaxtokens
    desc: Aggregate estimated input token budget (default 100000)
  - name: wikiroot
    desc: Existing local destination wiki directory
  - name: wikiaccess
    desc: Explicit rw required to apply or delete/cancel plans (default ro)
  - name: model
    desc: Model configuration, otherwise OAF_MODEL

ojob:
  opacks:
  - openaf: 20250915
  logToConsole: true

todo:
- Mini-A Wiki Absorb

jobs:
- name: Mini-A Wiki Absorb
  exec: |
    var miniALibraryRoot = String(new java.io.File(String(ow.oJob.__file)).getCanonicalFile().getParent())
    if (!io.fileExists(miniALibraryRoot + "/js/mini-a-paths.js")) miniALibraryRoot = getOPackPath("mini-a")
    if (!isString(miniALibraryRoot) || !io.fileExists(miniALibraryRoot + "/js/mini-a-paths.js")) throw new Error("Cannot locate the Mini-A package for " + ow.oJob.__file)
    loadLib(miniALibraryRoot + "/js/mini-a-paths.js")
    __miniAPackageRoot = __miniAResolvePackageRoot(miniALibraryRoot)
    loadLib(__miniAPath("js/core/mini-a-common.js"))
    loadLib(__miniAPath("js/wiki/mini-a-absorb.js"))
    var result = new MiniAAbsorb(args, log).run()
    print(printTree(result))
    if (!result.ok) exit(1)
