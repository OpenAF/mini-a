# Internal fixed worker entrypoint. Never accepts job code or engine flags over HTTP.
ojob:
  logToConsole: false
  catch: |
    printErr("Wiki Studio worker startup failed: " + exception); exit(1)
todo:
- Run Studio job
jobs:
- name: Run Studio job
  exec: |
    var base = String(new java.io.File(String(ow.oJob.__file)).getCanonicalFile().getParent())
    loadLib(base + "/js/studio/wiki-studio-bootstrap.js")
    wikiStudioBootstrap(base)
    loadLib(base + "/js/studio/wiki-studio-common.js")
    loadLib(base + "/js/studio/wiki-studio-registry.js")
    loadLib(base + "/js/studio/wiki-studio-api.js")
    loadLib(base + "/js/studio/wiki-studio-pages.js")
    loadLib(base + "/js/studio/wiki-studio-outbound.js")
    loadLib(base + "/js/studio/wiki-studio-sources.js")
    loadLib(base + "/js/studio/wiki-studio-jobs.js")
    loadLib(base + "/js/studio/wiki-studio-operations.js")
    loadLib(base + "/js/studio/wiki-studio-backups.js")
    loadLib(base + "/js/studio/wiki-studio-ingestion.js")
    wikiStudioRunWorker({ home: WikiStudio.canonical(String(args.studiohome)), base: base }, String(args.jobid))
