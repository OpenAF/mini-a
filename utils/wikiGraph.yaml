          if(n===selected||n===hovered){ctx.strokeStyle=colors.get(n.type);ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,r+6+(paused?0:Math.sin(time/600)*1.5),0,Math.PI*2);ctx.stroke();}
          if($('labels').checked&&bright&&(n===selected||n===hovered||scale>.8||n.degree>3&&scale>.35)){ctx.font='11px system-ui';ctx.fillStyle='#c6d7ee';var label=n.label.length>36?n.label.slice(0,34)+'…':n.label;ctx.fillText(label,x+r+7,y+4);}
        });ctx.globalAlpha=1;
