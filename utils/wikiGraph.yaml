        var near=new Set(selected?[selected.id]:[]);if(selected) adjacent.get(selected.id).forEach(function(e){near.add(e.from);near.add(e.to);});
        visibleEdges.forEach(function(e) {
          var active=selected&&(e.from===selected.id||e.to===selected.id);
          ctx.strokeStyle=active?'#9be5e9':colors.get(e.a.type);ctx.globalAlpha=active?.65:selected?.055:.15;ctx.lineWidth=active?1.3:.65;
