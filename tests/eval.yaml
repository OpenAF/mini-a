jobs:
- name: MiniA Eval Tests::Init
  exec: args.tests = require("tests/eval.js")

- name: MiniA Eval Tests::ScenarioMetrics
  from: MiniA Eval Tests::Init
  to  : oJob Test
  exec: args.func = args.tests.testEvalScenarioCollectsMetricsAndAssertions

- name: MiniA Eval Tests::FailuresAndJudge
  from: MiniA Eval Tests::Init
  to  : oJob Test
  exec: args.func = args.tests.testEvalScenarioReportsFailuresAndOptionalJudge

- name: MiniA Eval Tests::SuiteAndBaseline
  from: MiniA Eval Tests::Init
  to  : oJob Test
  exec: args.func = args.tests.testEvalSuiteAndBaselineComparison

- name: MiniA Eval Tests::YamlLoad
  from: MiniA Eval Tests::Init
  to  : oJob Test
  exec: args.func = args.tests.testEvalYamlDefinitionLoads

- name: MiniA Eval Tests::HistoryVmShadowMetrics
  from: MiniA Eval Tests::Init
  to  : oJob Test
  exec: args.func = args.tests.testEvalNormalizesHistoryVmShadowMetrics

- name: MiniA Eval Tests::ConversationReplay
  from: MiniA Eval Tests::Init
  to  : oJob Test
  exec: args.func = args.tests.testEvalMaterializesAndCleansConversationReplay

- name: MiniA Eval Tests::PhaseVariantMatrix
  from: MiniA Eval Tests::Init
  to  : oJob Test
  exec: args.func = args.tests.testEvalExpandsPhaseVariantMatrix

- name: MiniA Eval Tests::SkillCountersAndIsolation
  from: MiniA Eval Tests::Init
  to: oJob Test
  exec: args.func = args.tests.testEvalSkillCountersAndIsolation

- name: MiniA Eval Tests::WikiMetadataAndRetrieval
  from: MiniA Eval Tests::Init
  to: oJob Test
  exec: args.func = args.tests.testEvalWikiMetadataAndRetrieval

- name: MiniA Eval Tests::SkillDeltasAndUnavailable
  from: MiniA Eval Tests::Init
  to: oJob Test
  exec: args.func = args.tests.testEvalSkillDeltasAndUnavailable

- name: MiniA Eval Tests::DecideJudge
  from: MiniA Eval Tests::Init
  to: oJob Test
  exec: args.func = args.tests.testEvalDecideJudge

- name: MiniA Eval Tests::DecideJudgeFailures
  from: MiniA Eval Tests::Init
  to: oJob Test
  exec: args.func = args.tests.testEvalDecideJudgeFailures

- name: MiniA Eval Tests::SkillExamplePairs
  from: MiniA Eval Tests::Init
  to: oJob Test
  exec: args.func = args.tests.testEvalSkillExamplePairs

- name: MiniA Eval Tests::SkillExampleExecution
  from: MiniA Eval Tests::Init
  to: oJob Test
  exec: args.func = args.tests.testEvalSkillExampleExecution

- name: MiniA Eval Tests::DecideSkillSelection
  from: MiniA Eval Tests::Init
  to: oJob Test
  exec: args.func = args.tests.testEvalDecideSkillSelection

- name: MiniA Eval Tests::SupervisedWorkspace
  from: MiniA Eval Tests::Init
  to: oJob Test
  exec: args.func = args.tests.testEvalSupervisedWorkspaceAndWarmup

- name: MiniA Eval Tests::SupervisedIndependentAcceptance
  from: MiniA Eval Tests::Init
  to: oJob Test
  exec: args.func = args.tests.testEvalLcBaselineAndIncorrectCompletion

include:
- oJobTest.yaml

ojob:
  opacks:
  - oJob-common

