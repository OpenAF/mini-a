- name: MiniA Wiki Utils Jobs Tests::DreamArgs
  from: MiniA Wiki Utils Jobs Tests::Init
  to  : oJob Test
  exec: args.func = args.tests.testDreamArgs

- name: MiniA Wiki Utils Jobs Tests::BackupZip
  from: MiniA Wiki Utils Jobs Tests::Init
  to  : oJob Test
  exec: args.func = args.tests.testBackupZip

- name: MiniA Wiki Utils Jobs Tests::HydrateAndDreamJobs
  from: MiniA Wiki Utils Jobs Tests::Init
