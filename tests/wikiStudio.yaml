include:
- oJobTest.yaml
ojob:
  logToConsole: false
jobs:
- name: Studio registry
  to: oJob Test
  exec: args.func = require("tests/wikiStudio.js").testRegistry
- name: Studio authorization
  to: oJob Test
  exec: args.func = require("tests/wikiStudio.js").testAuth
- name: Studio paths
  to: oJob Test
  exec: args.func = require("tests/wikiStudio.js").testPaths
- name: Studio atomic persistence
  to: oJob Test
  exec: args.func = require("tests/wikiStudio.js").testAtomicAndLocks
- name: Studio pages
  to: oJob Test
  exec: args.func = require("tests/wikiStudio.js").testPages
- name: Studio graph
  to: oJob Test
  exec: args.func = require("tests/wikiStudio.js").testGraph
- name: Studio durable jobs
  to: oJob Test
  exec: args.func = require("tests/wikiStudio.js").testJobs
- name: Studio source boundaries
  to: oJob Test
  exec: args.func = require("tests/wikiStudio.js").testSources
