# Author: OpenAI Assistant
help:
  text   : A standalone STDIO/HTTP MCP wiki knowledge base server (read-only)
  expects:
  - name     : onport
    desc     : If defined starts an HTTP MCP server on this port; otherwise uses STDIO
    example  : "8888"
    mandatory: false
  - name     : wikibackend
    desc     : Wiki backend type (fs, s3, s3fs or es)
    example  : "fs"
    mandatory: false
  - name     : wikiroot
    desc     : "Base directory for fs backend (default: current directory)"
    example  : "./wiki"
    mandatory: false
  - name     : wikibucket
    desc     : S3 bucket for s3 backend
    example  : "my-wiki-bucket"
    mandatory: false
  - name     : wikiprefix
    desc     : S3 key prefix for s3/s3fs backend, or Elasticsearch index for es backend
    example  : "wiki/"
    mandatory: false
  - name     : wikiurl
    desc     : S3 endpoint/base URL for s3/s3fs, or Elasticsearch/OpenSearch base URL for es (internal esurl)
    example  : "https://s3.amazonaws.com"
    mandatory: false
  - name     : wikiaccesskey
    desc     : S3 access key, or Elasticsearch username for es backend
    mandatory: false
  - name     : wikisecret
    desc     : S3 secret key, or Elasticsearch password for es backend
    mandatory: false
  - name     : wikiregion
    desc     : S3 region
    mandatory: false
  - name     : wikiuseversion1
    desc     : Force S3 signature version 1
    example  : "false"
    mandatory: false
  - name     : wikiignorecertcheck
    desc     : Ignore TLS cert validation on S3 endpoint
    example  : "false"
    mandatory: false
  - name     : toolPrefix
    desc     : Optional prefix prepended to all tool names (e.g. "docs-" -> docs-list, docs-read, ...)
    example  : "wiki-"
    mandatory: false
  - name     : label
    desc     : Human-readable wiki label injected into templated tool descriptions
    example  : "Team wiki"
    mandatory: true
  - name     : wikimounts
    desc     : "SLON/JSON array of read-only wiki mounts: [{name, backend, root|bucket|prefix|url|...}]"
    example  : "[{name: 'team', backend: 'fs', root: './team-wiki'}]"
    mandatory: false
  - name     : usewikigraph
    desc     : "Enable the wiki knowledge graph. Also enabled automatically when `wikigraphfalkorhost` is provided. Search transparently appends related-page hints."
    example  : "false"
    mandatory: false
  - name     : wikigraphfalkorhost
    desc     : FalkorDB host for graph-backed wiki state and queries. Also enables the wiki graph automatically.
    mandatory: false
  - name     : wikigraphfalkorport
    desc     : FalkorDB port
    example  : "6379"
    mandatory: false
  - name     : wikigraphfalkorgraph
    desc     : FalkorDB graph name
    example  : "mini_a_wiki"
    mandatory: false
  - name     : wikigraphfalkoruser
    desc     : FalkorDB username
    mandatory: false
  - name     : wikigraphfalkorpass
    desc     : FalkorDB password
    mandatory: false
  - name     : wikigraphsearchhints
    desc     : Append graph-related pages to search results when the wiki graph is enabled
    example  : "true"
    mandatory: false
  - name     : wikigraphhintcap
    desc     : Maximum graph-hint pages appended to search results
    example  : "5"
    mandatory: false
  - name     : wikirestrict
    desc     : Enable opt-in restricted retrieval (only opaque-reference search and bounded read excerpts)
    example  : "true"
    mandatory: false
  - name     : wikirestrictsearchlimit
    desc     : "Restricted-mode maximum search results (default: 3; ceiling: 10)"
    mandatory: false
  - name     : wikirestrictminquerychars
    desc     : "Restricted-mode minimum useful query length (default: 4)"
    mandatory: false
  - name     : wikirestrictmetachars
    desc     : "Restricted-mode metadata character cap per result (default: 300)"
    mandatory: false
  - name     : wikirestrictreadlines
    desc     : "Restricted-mode maximum excerpt lines (default: 40; ceiling: 100)"
    mandatory: false
  - name     : wikirestrictreadchars
    desc     : "Restricted-mode maximum excerpt characters (default: 6000; ceiling: 16000)"
    mandatory: false
  - name     : wikirestrictrefttl
    desc     : "Restricted-mode opaque reference lifetime in seconds (default: 120)"
    mandatory: false
  - name     : wikirestrictmaxsearches
    desc     : "Restricted-mode searches per budget window (default: 30)"
    mandatory: false
  - name     : wikirestrictmaxreads
    desc     : "Restricted-mode reads per budget window (default: 15)"
    mandatory: false
  - name     : wikirestrictmaxchars
    desc     : "Restricted-mode total disclosed characters per budget window (default: 60000)"
    mandatory: false
  - name     : wikirestrictwindow
    desc     : "Restricted-mode budget window in seconds (default: 3600)"
    mandatory: false
  - name     : wikirestrictpagecooldown
    desc     : "Restricted-mode delay before a page may receive another reference (default: 3600)"
    mandatory: false
  - name     : wikirestrictstate
    desc     : Optional persistent restricted-retrieval ledger path outside wikiroot
    mandatory: false

