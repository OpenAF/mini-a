# Author: Nuno Aguiar
help:
  text   : A standalone STDIO/HTTP MCP virtual skill-library server (read-only). Backed by the same wiki engine as mcp-wiki.yaml -- see docs/VIRTUAL-SKILLS.md.
  expects:
  - name     : onport
    desc     : If defined starts an HTTP MCP server on this port; otherwise uses STDIO
    example  : "8890"
    mandatory: false
  - name     : wikibackend
    desc     : Wiki backend type (fs, s3, s3fs, es or http; https is an alias)
    example  : "fs"
    mandatory: false
  - name     : wikiroot
    desc     : "Base directory or local .zip/.okt archive holding skill (and optionally ordinary knowledge) pages for the fs backend (archives are always read-only)"
    example  : "./skills"
    mandatory: false
  - name     : wikibucket
    desc     : S3 bucket for s3 backend
    mandatory: false
  - name     : wikiprefix
    desc     : S3 key prefix for s3/s3fs backend, or Elasticsearch index for es backend
    example  : "skills/"
    mandatory: false
  - name     : wikiurl
    desc     : S3 endpoint for s3/s3fs, Elasticsearch/OpenSearch base URL for es, or static base URL for http
    mandatory: false
  - name     : wikiaccesskey
    desc     : S3 access key, or Elasticsearch username for es backend
    mandatory: false
  - name     : wikisecret
    desc     : S3 secret key, or Elasticsearch password for es backend
    mandatory: false
  - name     : wikiregion
    desc     : S3 region
    mandatory: false
  - name     : wikiuseversion1
    desc     : Force S3 signature version 1
    mandatory: false
  - name     : wikiignorecertcheck
    desc     : Ignore TLS cert validation on S3 endpoint
    mandatory: false
  - name     : wikis3artifactprefix
    desc     : "Optional S3 prefix containing a published local wiki cache. Downloaded to wikiindexdir at startup."
    mandatory: false
  - name     : s3artifactbundle
    desc     : Use <prefix>/mini-a-wiki-index.zip instead of individual S3 artifact objects
    mandatory: false
  - name     : wikihttpindexurl
    desc     : Optional HTTP artifact bundle URL (defaults to <wikiurl>/mini-a-wiki-index.zip)
    mandatory: false
  - name     : wikihttptimeout
    desc     : HTTP request timeout in milliseconds (default 30000)
    mandatory: false
  - name     : wikiartifactrefreshsecs
    desc     : Recheck an HTTP or bundled-S3 artifact cache after this many seconds between requests (0 disables; default 0)
    mandatory: false
  - name     : wikiindexdir
    desc     : Local cache directory used for downloaded S3 search and graph artifacts
    mandatory: false
  - name     : wikilexical
    desc     : "SLON/JSON Lucene lexical configuration. Defaults to {language: 'english'}."
    mandatory: false
  - name     : toolPrefix
    desc     : Optional prefix prepended to all tool names (e.g. "skills-" -> skills-search, skills-open, ...)
    example  : "skills-"
    mandatory: false
  - name     : label
    desc     : Human-readable skill library label injected into templated tool descriptions
    example  : "Engineering skill library"
    mandatory: true
  - name     : wikimounts
    desc     : "SLON/JSON array of read-only skill-library mounts: [{name, label?, description?, backend, root|bucket|prefix|url|...}]. name is the stable wiki selector used by search/recommend's wiki parameter."
    example  : "[{name: 'devops', label: 'DevOps Skills', backend: 'fs', root: './devops-skills'}]"
    mandatory: false
  - name     : usewikigraph
    desc     : "Enable the knowledge graph so related() can surface requires/related/uses-style connections between skills. Also enabled automatically when wikigraphfalkorhost is provided."
    mandatory: false
  - name     : wikigraphfalkorhost
    desc     : FalkorDB host for graph-backed state. Also enables the graph automatically.
    mandatory: false
  - name     : wikigraphfalkorport
    desc     : FalkorDB port
    mandatory: false
  - name     : wikigraphfalkorgraph
    desc     : FalkorDB graph name
    mandatory: false
  - name     : wikigraphfalkoruser
    desc     : FalkorDB username
    mandatory: false
  - name     : wikigraphfalkorpass
    desc     : FalkorDB password
    mandatory: false
  - name     : wikigraphcross
    desc     : Join this library's graph with mounted libraries' graphs at query time (explicit links, shared tags/aliases/concepts).
    mandatory: false
  - name     : audit
    desc     : "If true (or env OJOB_MCP_AUDIT), logs every MCP tool call plus every page fetched from a remote backend (s3, http, es)."
    mandatory: false

todo:
- Init
- (if    ): "isDef(args.onport)"
  ((then)):
  - (httpdStart   ): "${onport:-8890}"
  - (httpdHealthz ): "${onport:-8890}"
  - (httpdMetrics ): "${onport:-8890}"
  - (httpdMCP     ): "${onport:-8890}"
    ((toolPrefix )): "${toolPrefix:-}"
    ((tplDesc    )): true
    ((description)): &MCPSERVER
      serverInfo:
        name   : mcp-skills
        title  : "{{label}}"
        version: 1.0.0
    ((fnsMeta)): &MCPFNSMETA
      context:
        name       : context
        description: "[ORIENTATION] Compact overview of {{label}}: how many skills exist, which skill-library wikis are available, and which capabilities (search/recommend/graph/multiWiki) are enabled. Never lists individual skills -- call once before search/recommend."
        inputSchema:
          type      : object
          properties: {}
        annotations:
          title         : context
          readOnlyHint  : true
          idempotentHint: true

      search:
        name       : search
        description: "[START HERE] Search {{label}} for skills matching a lexical query, optionally filtered by tags/appliesTo/compatibility/maxRisk. Returns compact metadata only (name/title/summary/tags/risk/ref) -- never the skill body. Call open() on the best ref before read()."
        inputSchema:
          type      : object
          properties:
            query:
              type       : string
              description: "Lexical keyword query (terms, names, aliases). Omit to browse by tags/appliesTo/compatibility alone."
            limit:
              type       : integer
              description: Maximum number of results.
              default    : 10
            wiki:
              oneOf:
              - { type: string }
              - { type: array, items: { type: string } }
              description: "Skill-library selector: omitted/'*'=all, a mount name, or an array of mount names. context() lists available names."
            tags:
              type       : array
              items      : { type: string }
              description: Only return skills carrying at least one of these tags.
            appliesTo:
              type       : array
              items      : { type: string }
              description: Only return skills applicable to at least one of these subjects/technologies.
            compatibility:
              type       : string
              description: "Only return skills whose compatibility map has this key set to true (e.g. 'codex', 'claude-code')."
            maxRisk:
              type       : string
              enum       : [low, medium, high]
              description: Exclude skills whose declared risk exceeds this level.
            type:
              type       : string
              description: "Frontmatter type filter. Defaults to 'skill'; pass '*' to also match ordinary (non-skill) wiki pages."
        annotations:
          title         : search
          readOnlyHint  : true
          idempotentHint: true

      recommend:
        name       : recommend
        description: "Given a free-text task description (and optional environment/capabilities hints), rank the skills most likely to help. Deterministic lexical+metadata ranking today; same compact result shape as search()."
        inputSchema:
          type      : object
          properties:
            task:
              type       : string
              description: Natural-language description of the task at hand.
            environment:
              type       : object
              description: "Optional free-form hints, e.g. {language: 'java', platform: 'kubernetes'}."
            capabilities:
              type       : array
              items      : { type: string }
              description: "Tool/capability names available to the caller, e.g. ['shell', 'filesystem-read']."
            limit:
              type       : integer
              description: Maximum number of results.
              default    : 5
            wiki:
              oneOf:
              - { type: string }
              - { type: array, items: { type: string } }
          required  : [ task ]
        annotations:
          title         : recommend
          readOnlyHint  : true
          idempotentHint: true

      open:
        name       : open
        description: "Inspect a skill cheaply before reading it. Returns metadata, headings, size, requirements, risk, compatibility and version -- never the skill body. Pass the ref returned by search/recommend."
        inputSchema:
          type      : object
          properties:
            ref:
              type       : string
              description: "Skill reference returned by search/recommend/related."
            maxHeadings:
              type       : integer
              default    : 40
          required  : [ ref ]
        annotations:
          title         : open
          readOnlyHint  : true
          idempotentHint: true

      read:
        name       : read
        description: "Read one bounded section (or line range) of a skill's body. Defaults to a small maxChars -- prefer section= (from open()'s headings) over reading a whole skill."
        inputSchema:
          type      : object
          properties:
            ref:
              type       : string
              description: Skill reference from search/recommend/open/related.
            section:
              type       : string
              description: Read only the body under this heading name.
            startLine:
              type       : integer
            endLine:
              type       : integer
            maxChars:
              type       : integer
              description: Maximum characters returned (default 4000; continuation cursor returned when exceeded).
          required  : [ ref ]
        annotations:
          title         : read
          readOnlyHint  : true
          idempotentHint: true

      related:
        name       : related
        description: "Discover skills related to a known skill via backlinks and the existing knowledge graph (requires/related/uses-style connections), including across mounted skill libraries. Use only after open() when the current skill isn't quite enough."
        inputSchema:
          type      : object
          properties:
            ref:
              type       : string
              description: Skill reference from search/recommend/open.
            limit:
              type       : integer
              default    : 10
          required  : [ ref ]
        annotations:
          title         : related
          readOnlyHint  : true
          idempotentHint: true

      compose:
        name       : compose
        description: "Build a bounded, metadata-only prerequisite view from a skill's explicit depends_on/dependsOn declarations. It does not read dependency bodies, recursively expand them, invoke tools, or grant capabilities; normal agent policy remains in force."
        inputSchema:
          type      : object
          properties:
            ref:
              type       : string
              description: Skill reference from search/recommend/open.
            limit:
              type       : integer
              description: Maximum explicit prerequisites to inspect (default 4; maximum 8).
              default    : 4
            wiki:
              oneOf:
              - { type: string }
              - { type: array, items: { type: string } }
              description: "Optional wiki selector when resolving logical skill: dependencies."
          required  : [ ref ]
        annotations:
          title         : compose
          readOnlyHint  : true
          idempotentHint: true

    ((fns    )): &MCPFNS
      context  : Skills context overview
      search   : Skills search
      recommend: Skills recommend
      open     : Skills open
      read     : Skills read
      related  : Skills related
      compose  : Skills compose
  ((else)):
  - (stdioMCP  ): *MCPSERVER
    ((toolPrefix)): "${toolPrefix:-}"
    ((tplDesc   )): true
    ((fnsMeta   )): *MCPFNSMETA
    ((fns       )): *MCPFNS

ojob:
  opacks      :
  - openaf     : 20250915
  - oJob-common: 20250914
  - mini-a     : 20260807
  catch       : printErrnl("[" + job.name + "] "); $err(exception, __, __, job.exec)
  logToConsole: false
  argsFromEnvs: true
  daemon      : true
  unique      :
    pidFile     : .mcp-skills.pid
    killPrevious: true

include:
- oJobMCP.yaml

jobs:
- name : Init
  check:
    in:
      wikibackend         : isString.default("fs")
      wikiroot            : isString.default(__)
      wikibucket          : isString.default(__)
      wikiprefix          : isString.default("skills/")
      wikiurl             : isString.default("https://s3.amazonaws.com")
      wikiaccesskey       : isString.default(__)
      wikisecret          : isString.default(__)
      wikiregion          : isString.default(__)
      wikiuseversion1     : toBoolean.isBoolean.default(false)
      wikiignorecertcheck : toBoolean.isBoolean.default(false)
      wikis3artifactprefix: isString.default(__)
      s3artifactbundle     : toBoolean.isBoolean.default(false)
      wikihttpindexurl     : isString.default(__)
      wikihttptimeout      : toNumber.isNumber.default(30000)
      wikiartifactrefreshsecs: toNumber.isNumber.default(0)
      wikiindexdir         : isString.default(__)
      wikilexical          : isString.default(__)
      usewikigraph        : toBoolean.isBoolean.default(false)
      wikigraphfalkorhost : isString.default(__)
      wikigraphfalkorport : toNumber.isNumber.default(__)
      wikigraphfalkorgraph: isString.default(__)
      wikigraphfalkoruser : isString.default(__)
      wikigraphfalkorpass : isString.default(__)
      wikigraphcross      : toBoolean.isBoolean.default(__)
      label               : isString.default("Skill library")
      wikimounts          : isString.default(__)
      audit               : default(__)
  exec : | #js
    loadLib("mini-a-mcp-skills.js")
    __miniAMcpSkillsInit(args, {
      access   : "ro",
      readonly : true,
      agenticRetrieval: true,
      logPrefix: "mcp-skills"
    })

- name : Skills context overview
  check:
    in: {}
  exec : | #js
    return __miniAMcpSkillsContext(args)

- name : Skills search
  check:
    in:
      query        : isString.default("")
      limit        : toNumber.isNumber.default(10)
      wiki         : default(__)
      tags         : default(__)
      appliesTo    : default(__)
      compatibility: isString.default(__)
      maxRisk      : isString.default(__)
      type         : isString.default(__)
  exec : | #js
    return __miniAMcpSkillsSearch(args)

- name : Skills recommend
  check:
    in:
      task        : isString
      environment : default(__)
      capabilities: default(__)
      limit       : toNumber.isNumber.default(5)
      wiki        : default(__)
  exec : | #js
    return __miniAMcpSkillsRecommend(args)

- name : Skills open
  check:
    in:
      ref        : isString
      maxHeadings: toNumber.isNumber.default(40)
  exec : | #js
    return __miniAMcpSkillsOpen(args)

- name : Skills read
  check:
    in:
      ref      : isString
      section  : isString.default(__)
      startLine: toNumber.isNumber.default(__)
      endLine  : toNumber.isNumber.default(__)
      maxChars : toNumber.isNumber.default(4000)
  exec : | #js
    return __miniAMcpSkillsRead(args)

- name : Skills related
  check:
    in:
      ref  : isString
      limit: toNumber.isNumber.default(10)
  exec : | #js
    return __miniAMcpSkillsRelated(args)

- name : Skills compose
  check:
    in:
      ref  : isString
      limit: toNumber.isNumber.default(4)
      wiki : default(__)
  exec : | #js
    return __miniAMcpSkillsCompose(args)
