# Author: Nuno Aguiar
help:
  text: Stateless OpenAF decisions over STDIO or HTTP. Requires OAF_DECIDE_MODEL and an OpenAF runtime with the decision API.
  expects:
  - name: onport
    desc: Optional HTTP port; omitted for STDIO.
    mandatory: false

todo:
- (if): "isDef(args.onport)"
  ((then)):
  - (httpdStart): "${onport}"
  - (httpdHealthz): "${onport}"
  - (httpdMetrics): "${onport}"
  - (httpdMCP): "${onport}"
    ((description)): &SERVER
      serverInfo:
        name: mini-a-decide
        title: OpenAF stateless decisions
        version: 1.0.0
    ((fnsMeta)): &META
      decide:
        name: decide
        description: Evaluate named choice, boolean or ordinal score questions against one state. Returns normalized response and available usage stats. Does not execute tools. Provider probabilities are not calibrated correctness.
        inputSchema:
          type: object
          additionalProperties: false
          properties:
            state:
              description: Nonempty text or JSON object/array evaluated by every question.
              anyOf:
              - type: string
                minLength: 1
              - type: object
              - type: array
            questions:
              type: object
              minProperties: 1
              additionalProperties:
                type: object
                additionalProperties: false
                properties:
                  type:
                    type: string
                    enum: [choice, boolean, score]
                  instructions:
                    type: string
                    minLength: 1
                  criteria:
                    anyOf:
                    - type: object
                      additionalProperties:
                        type: string
                        minLength: 1
                    - type: array
                      minItems: 2
                      items:
                        type: string
                        minLength: 1
                required: [type, instructions]
            options:
              type: object
              additionalProperties: false
              properties:
                strategy:
                  type: string
                  enum: [auto, native, structured]
                model:
                  type: string
                  description: Request-scoped model override within the server-configured provider.
                requireProbabilities:
                  type: boolean
                providerOptions:
                  type: object
                  description: OpenAF provider allowlist applies; never accepts credentials or endpoint URLs.
                images:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: Native only. Ollama raw base64; OpenAI inline base64 image data URLs. No paths or external URLs.
          required: [state, questions]
        annotations:
          readOnlyHint: true
          idempotentHint: false
          openWorldHint: true
      get-capabilities:
        name: get-capabilities
        description: Inspect configuration availability and decision adapter capabilities without contacting the provider. Unknown availability does not guarantee model or account access.
        inputSchema:
          type: object
          properties: {}
          additionalProperties: false
        annotations:
          readOnlyHint: true
          idempotentHint: true
    ((fns)): &FNS
      decide: Evaluate decisions
      get-capabilities: Decision capabilities
  ((else)):
  - name: Decision STDIO
    args:
      description: *SERVER
      fnsMeta: *META

ojob:
  opacks:
  - openaf
  - oJob-common
  logToConsole: false
  argsFromEnvs: true
  daemon: true
  loadLibs:
  - mini-a-decision.js

include:
- oJobMCP.yaml

jobs:
- name: Decision STDIO
  typeArgs:
    noLog: true
  exec: | #js
    // Direct STDIO callbacks preserve typed Error messages. The common job
    // wrapper stringifies thrown errors, losing their message on this transport.
    ow.loadServer()
    ow.server.mcpStdio(args.description, Object.keys(args.fnsMeta).map(function(key) { return args.fnsMeta[key] }), {
      decide: function(request) { return MiniADecision.request(request) },
      "get-capabilities": function() { return new MiniADecision().getCapabilities() }
    }, __, { modern: toBoolean(args.modern) === true })

- name: Evaluate decisions
  exec: | #js
    try {
      var requestKeys = Object.keys(args).filter(function(key) { return ["objId", "execid", "__id", "_httprequest"].indexOf(key) < 0 })
      var request = {}
      requestKeys.forEach(function(key) { request[key] = args[key] })
      return MiniADecision.request(request)
    } catch(e) {
      var safe = MiniADecision.sanitize(e)
      return { isError: true, content: [{ type: "text", text: stringify({ error: { code: safe.code, status: safe.status } }, __, "") }] }
    }

- name: Decision capabilities
  exec: | #js
    return new MiniADecision().getCapabilities()
